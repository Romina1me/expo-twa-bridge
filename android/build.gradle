plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.twabridge'
version = '0.1.0'

android {
  namespace "expo.modules.twabridge"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
  testImplementation 'junit:junit:4.13.2'
}
